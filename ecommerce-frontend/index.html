<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store & Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Auth Section -->
  <section id="auth-section" class="auth-card">
    <div class="tabs">
      <button id="tab-login-btn" class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
      <button id="tab-register-btn" class="tab-btn" onclick="switchAuthTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="input-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="user@example.com" required>
      </div>
      <div class="input-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="hidden">
      <div class="input-group">
        <label for="reg-name">Name</label>
        <input type="text" id="reg-name" placeholder="John Doe" required>
      </div>
      <div class="input-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="user@example.com" required>
      </div>
      <div class="input-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-success">Register</button>
    </form>

    <p id="auth-error" class="error-msg"></p>
  </section>

  <!-- Main App Dashboard -->
  <section id="app-section" class="dashboard-container hidden">
    <header class="navbar">
      <h2>E-Commerce Dashboard</h2>
      <div class="nav-actions">
        <button id="cart-toggle-btn" class="btn btn-secondary" onclick="fetchCart()">Cart (<span id="cart-count">0</span>)</button>
        <button id="logout-btn" class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="content-layout">
      <!-- Admin Add Product Panel -->
      <aside class="card form-card">
        <h3 id="form-title">Add New Product</h3>
        <form id="product-form">
          <input type="hidden" id="edit-product-id">
          <div class="input-group">
            <label for="p-name">Title</label>
            <input type="text" id="p-name" placeholder="iPhone 15 Pro" required>
          </div>
          <div class="input-group">
            <label for="p-price">Price ($)</label>
            <input type="number" id="p-price" step="0.01" placeholder="999" required>
          </div>
          <div class="input-group">
            <label for="p-desc">Description</label>
            <textarea id="p-desc" rows="3" placeholder="Product details..." required></textarea>
          </div>
          <button type="submit" id="product-submit-btn" class="btn btn-primary">Create Product</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-outline hidden" onclick="resetProductForm()">Cancel</button>
          <p id="product-msg" class="msg"></p>
        </form>
      </aside>

      <!-- Products Feed -->
      <main class="products-feed">
        <h3>Catalog</h3>
        <div id="products-list" class="products-grid"></div>
      </main>
    </div>

    <!-- Cart Modal / Section -->
    <div id="cart-modal" class="modal hidden">
      <div class="modal-content card">
        <span class="close-btn" onclick="toggleCartModal(false)">&times;</span>
        <h3>Shopping Cart</h3>
        <div id="cart-items" class="cart-items-list"></div>
        <div class="cart-footer">
          <h4>Total: $<span id="cart-total">0.00</span></h4>
          <button class="btn btn-success" onclick="createOrder()">Checkout / Create Order</button>
        </div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
