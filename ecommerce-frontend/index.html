<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <main id="login-section" class="auth-card">
    <div class="auth-header">
      <h2>تسجيل الدخول</h2>
      <p>أدخل بيانات الحساب للوصول للوحة التحكم</p>
    </div>
    <form id="login-form">
      <div class="input-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="admin@example.com" required>
      </div>
      <div class="input-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">دخول</button>
      <p id="auth-error" class="error-msg"></p>
    </form>
  </main>

  <!-- لوحة إدارة والمنتجات -->
  <main id="products-section" class="dashboard-container hidden">
    <!-- Navbar -->
    <header class="navbar">
      <h1>متجر الإلكترونيات</h1>
      <button id="logout-btn" class="btn btn-outline">تسجيل الخروج</button>
    </header>

    <div class="content-grid">
      <!-- فورم إضافة منتج -->
      <section class="card form-card">
        <h3>إضافة منتج جديد</h3>
        <form id="add-product-form">
          <div class="input-group">
            <label for="product-name">اسم المنتج</label>
            <input type="text" id="product-name" placeholder="مثال: iPhone 15 Pro" required>
          </div>
          <div class="input-group">
            <label for="product-price">السعر ($)</label>
            <input type="number" id="product-price" placeholder="999" step="0.01" required>
          </div>
          <div class="input-group">
            <label for="product-desc">وصف المنتج</label>
            <textarea id="product-desc" rows="3" placeholder="اكتب وصفاً قصيراً للمنتج..." required></textarea>
          </div>
          <button type="submit" class="btn btn-success">إضافة إلى المتجر</button>
          <p id="product-error" class="error-msg"></p>
        </form>
      </section>

      <!-- قائمة المنتجات -->
      <section class="products-container">
        <h3>قائمة المنتجات المتاحة</h3>
        <div id="products-list" class="products-grid"></div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
